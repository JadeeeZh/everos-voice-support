[project]
name = "voicedemo"
version = "0.1.0"
description = "EverOS telecom voice-support demo: learn across calls, not just remember callers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "tau2",
]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicedemo"]

[tool.ruff]
line-length = 88
target-version = "py312"
